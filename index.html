<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Hobbit: Un viaje inesperado</title>
<style>
:root{color-scheme:dark;--bg:#0b0a14;--panel:#15132a;--text:#f5f3ff;--muted:#a9a4cc;--a:#8b5cf6;--b:#22d3ee;--line:rgba(255,255,255,.1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;background:linear-gradient(#0b0a14e6,transparent);transition:background .3s}
nav.solid{background:#0b0a14f2;backdrop-filter:blur(12px)}
.logo{font-weight:900;font-size:1.5rem;letter-spacing:-.04em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-r{display:flex;gap:22px;font-size:.9rem;color:var(--muted)}
.nav-r span:first-child{color:var(--text)}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:110px 5vw 60px;background:radial-gradient(ellipse at 75% 20%,#3b1d8f 0,transparent 55%),radial-gradient(ellipse at 20% 90%,#0e5f7a 0,transparent 50%),#0b0a14;overflow:hidden}
.mount{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%;opacity:.5}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,var(--bg))}
.in{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:5vw;width:100%;max-width:1200px;margin:auto}
.txt{max-width:560px}
.badge{display:inline-flex;gap:8px;align-items:center;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--b);margin-bottom:14px;animation:up .7s both}
.badge i{width:22px;height:2px;background:var(--b)}
h1{font-size:clamp(2.3rem,7vw,4.4rem);font-weight:900;line-height:.95;letter-spacing:-.04em;margin-bottom:18px;animation:up .7s .1s both}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:.95rem;color:var(--muted);margin-bottom:18px;animation:up .7s .2s both}
.meta b{color:var(--text);font-weight:600}
.pill{border:1px solid var(--muted);border-radius:5px;padding:1px 7px;font-size:.8rem}
.hd{background:var(--a);border-color:var(--a);color:#fff}
.desc{line-height:1.6;color:#d8d4f2;margin-bottom:26px;animation:up .7s .3s both}
.btns{display:flex;flex-wrap:wrap;gap:12px;animation:up .7s .4s both}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 26px;font-weight:700;font-size:1rem;transition:transform .2s,box-shadow .2s,background .2s}
.play{background:linear-gradient(90deg,var(--a),var(--b));color:#06060f}
.play:hover{transform:scale(1.05);box-shadow:0 10px 40px #8b5cf666}
.more{background:#ffffff1f;color:var(--text);backdrop-filter:blur(8px)}
.more:hover{background:#ffffff33;transform:scale(1.05)}
.poster{flex:0 0 auto;width:min(280px,34vw);aspect-ratio:2/3;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(160deg,#5b2fd6,#0e7490 70%,#0b0a14);box-shadow:0 30px 80px #000a,0 0 0 1px var(--line);animation:pop .9s .3s both;transition:transform .5s}
.poster:hover{transform:rotate(-2deg) scale(1.04)}
.poster svg{position:absolute;inset:auto 0 0;width:100%}
.poster span{position:absolute;top:18px;left:0;right:0;text-align:center;font-weight:900;font-size:1.9rem;letter-spacing:.06em;line-height:1.05;text-shadow:0 4px 20px #0008}
.poster small{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:.7rem;letter-spacing:.3em;color:#ffffffb3}
section{padding:60px 5vw;max-width:1200px;margin:auto}
h2{font-size:1.4rem;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-5px);border-color:var(--a)}
.card h3{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card p{line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:#8b5cf626;border:1px solid #8b5cf655;border-radius:99px;padding:4px 12px;font-size:.85rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:30px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000d;backdrop-filter:blur(8px);padding:20px}
.modal.on{display:flex;animation:fade .3s both}
.box{position:relative;width:min(1000px,100%)}
.vid{position:relative;aspect-ratio:16/9;max-height:85vh;margin:auto;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 100px #8b5cf655;animation:pop .4s both}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;color-scheme:normal;background:#000}
.x{position:absolute;top:-46px;right:0;background:#ffffff22;color:#fff;border-radius:50%;width:38px;height:38px;padding:0;font-size:1.1rem}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hero{background-size:150% 150%,150% 150%;background-position:0 0,100% 100%;animation:bgmove 16s ease-in-out infinite alternate}
@keyframes bgmove{to{background-position:100% 50%,0 0}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(520px circle at var(--mx,72%) var(--my,30%),#8b5cf638,transparent 60%)}
.mount{animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-2%) scale(1.06)}to{transform:translateX(2%) scale(1.14)}}
.embers{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);opacity:0;animation:rise var(--d) linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--x),-105vh);opacity:0}}
h1{background:linear-gradient(90deg,#fff 0,#fff 40%,#c4b5fd 50%,#fff 60%,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s .1s both,shine 6s 1s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.play{animation:pulse 2.4s 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #8b5cf68c}70%{box-shadow:0 0 0 18px #8b5cf600}100%{box-shadow:0 0 0 0 #8b5cf600}}
.poster{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;animation:pop .9s .3s backwards,floaty 6s 1.3s ease-in-out infinite}
.poster:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.05)}
@keyframes floaty{50%{translate:0 -14px}}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff45 50%,transparent 60%);transform:translateX(-100%);animation:sweep 5s 1.5s infinite}
@keyframes sweep{60%,100%{transform:translateX(100%)}}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster.hasimg span,.poster.hasimg small,.poster.hasimg svg{display:none}
.card{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s,border-color .25s}
.card.show{opacity:1;transform:none}
.card.show:hover{transform:translateY(-6px)}
.logo{background-size:200% 100%;animation:shine2 5s linear infinite}
@keyframes shine2{to{background-position:-200% 0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:760px){.poster{display:none}.nav-r{display:none}.hero{padding-top:90px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav id="nav"><div class="logo">EL HOBBIT</div></nav>

<header class="hero">
  <svg class="mount" viewBox="0 0 1200 400" preserveAspectRatio="none"><path d="M0 400V250L150 150 260 240 420 60 560 220 700 120 860 250 1000 100 1200 260V400Z" fill="#0b0a14"/><path d="M0 400V320L180 230 330 310 500 180 680 300 860 200 1050 310 1200 240V400Z" fill="#150f33"/></svg>
  <div class="embers" id="embers"></div>
  <div class="in">
    <div class="txt">
      <div class="badge"><i></i><span id="genreTop"></span></div>
      <h1 id="title"></h1>
      <div class="meta"><b id="year"></b><span class="pill" id="rating"></span><b id="dur"></b></div>
      <p class="desc" id="desc"></p>
      <div class="btns">
        <button class="play" id="playBtn">▶ Reproducir</button>
        <button class="more" id="moreBtn">ⓘ Más información</button>
      </div>
    </div>
    <div class="poster" id="poster"><img id="posterImg" alt="" hidden>
      <span id="posterTitle"></span>
      <svg viewBox="0 0 280 200"><path d="M0 200V120L50 70 90 110 140 30 190 100 230 60 280 120V200Z" fill="#0b0a1499"/><path d="M0 200V150L60 110 110 150 170 90 230 140 280 110V200Z" fill="#0b0a14"/></svg>
      <small>UNA AVENTURA</small>
    </div>
  </div>
</header>

<section id="info">
  <h2>Detalles</h2>
  <div class="grid">
    <div class="card"><h3>Dirección</h3><p id="director"></p></div>
    <div class="card"><h3>Reparto</h3><p id="cast"></p></div>
    <div class="card"><h3>Géneros</h3><div class="tags" id="genres"></div></div>
    <div class="card"><h3>Duración</h3><p id="dur2"></p></div>
  </div>
</section>


<div class="modal" id="modal"><div class="box"><button class="x" id="close" aria-label="Cerrar">✕</button><div class="vid" id="vid"></div></div></div>

const $=id=>document.getElementById(id);
document.title=DATA.title;
$("title").textContent=DATA.title;$("posterTitle").textContent=DATA.posterTitle;
$("year").textContent=DATA.year;$("rating").textContent=DATA.rating;
$("dur").textContent=DATA.duration;$("dur2").textContent=DATA.duration;
$("desc").textContent=DATA.desc;$("director").textContent=DATA.director;$("cast").textContent=DATA.cast;
$("genreTop").textContent=DATA.genres[0];
DATA.genres.forEach(g=>{const s=document.createElement("span");s.textContent=g;$("genres").appendChild(s)});
function openP(){const f=document.createElement("iframe");f.src=DATA.video+"&autoplay=1";f.allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share";f.referrerPolicy="strict-origin-when-cross-origin";f.title=DATA.title;f.allowFullscreen=true;$("vid").replaceChildren(f);$("modal").classList.add("on")}
function closeP(){$("modal").classList.remove("on");$("vid").replaceChildren()}
$("playBtn").onclick=openP;$("close").onclick=closeP;
$("modal").onclick=e=>{if(e.target.id==="modal")closeP()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeP()});
const hero=document.querySelector(".hero"),poster=$("poster");
if(DATA.posterImage){$("posterImg").src=DATA.posterImage;$("posterImg").hidden=false;poster.classList.add("hasimg")}
hero.addEventListener("mousemove",e=>{const r=hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;hero.style.setProperty("--mx",e.clientX-r.left+"px");hero.style.setProperty("--my",e.clientY-r.top+"px");poster.style.setProperty("--ry",(x-.72)*16+"deg");poster.style.setProperty("--rx",(.4-y)*14+"deg")});
const em=$("embers");for(let i=0;i<26;i++){const s=document.createElement("i");s.style.cssText=`left:${Math.random()*100}%;--s:${2+Math.random()*4}px;--d:${8+Math.random()*10}s;--x:${(Math.random()-.5)*160}px;--c:${Math.random()>.5?"#22d3ee":"#a78bfa"};animation-delay:-${Math.random()*14}s`;em.appendChild(s)}
const cards=document.querySelectorAll(".card");
if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");setTimeout(()=>e.target.style.transitionDelay="0ms",1000);io.unobserve(e.target)}}),{threshold:.15});cards.forEach((c,i)=>{c.style.transitionDelay=i*100+"ms";io.observe(c)})}else cards.forEach(c=>c.classList.add("show"));
$("moreBtn").onclick=()=>$("info").scrollIntoView({behavior:"smooth"});
addEventListener("scroll",()=>$("nav").classList.toggle("solid",scrollY>40));
</script>
