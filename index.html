<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Hobbit: Un viaje inesperado</title>
<style>
:root{color-scheme:dark;--bg:#0c0a08;--panel:#171310;--text:#fbf6ea;--muted:#b9ac90;--a:#f5b53d;--b:#ff7b2e;--line:rgba(255,235,200,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;padding:18px 5vw;background:linear-gradient(#0c0a08e6,transparent);transition:background .3s}
nav.solid{background:#0c0a08f2;backdrop-filter:blur(12px)}
.logo{display:inline-block;font-weight:900;font-size:1.5rem;letter-spacing:-.03em;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine2 5s linear infinite}
@keyframes shine2{to{background-position:-200% 0}}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:110px 5vw 70px;overflow:hidden;background:#0c0a08}
.bd{position:absolute;inset:-8%;background:var(--poster) center 30%/cover;filter:blur(26px) saturate(1.25) brightness(.5);animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.05) translateX(-1.5%)}to{transform:scale(1.18) translateX(1.5%)}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(520px circle at var(--mx,72%) var(--my,30%),#f5b53d30,transparent 60%),linear-gradient(90deg,#0c0a08 8%,#0c0a0899 45%,transparent 80%)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:32%;z-index:1;background:linear-gradient(transparent,var(--bg))}
.embers{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.embers i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);opacity:0;animation:rise var(--d) linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--x),-105vh);opacity:0}}
.in{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:5vw;width:100%;max-width:1200px;margin:auto}
.txt{max-width:580px}
.badge{display:inline-flex;gap:10px;align-items:center;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--a);margin-bottom:14px;animation:up .7s both}
.badge i{width:24px;height:2px;background:var(--a)}
h1{font-size:clamp(2.3rem,7vw,4.4rem);font-weight:900;line-height:1;letter-spacing:-.035em;margin-bottom:18px;background:linear-gradient(90deg,#fff 0,#fff 40%,#ffd98a 50%,#fff 60%,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .7s .1s both,shine 6s 1s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:.95rem;color:var(--muted);margin-bottom:10px;animation:up .7s .2s both}
.meta b{color:var(--text);font-weight:600}
.pill{border:1px solid var(--muted);border-radius:5px;padding:1px 7px;font-size:.8rem}
.gen{color:var(--muted);font-size:.9rem;margin-bottom:16px;animation:up .7s .25s both}
.desc{line-height:1.65;color:#e6dcc4;margin-bottom:26px;animation:up .7s .3s both}
.btns{display:flex;flex-wrap:wrap;gap:12px;animation:up .7s .4s both}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 28px;font-weight:700;font-size:1rem;transition:transform .2s,box-shadow .2s,background .2s}
.play{background:linear-gradient(90deg,var(--a),var(--b));color:#1a1005;animation:pulse 2.4s 1.2s infinite}
.play:hover{transform:scale(1.06)}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f5b53d8c}70%{box-shadow:0 0 0 18px #f5b53d00}100%{box-shadow:0 0 0 0 #f5b53d00}}
.more{background:#ffffff24;color:var(--text);backdrop-filter:blur(8px)}
.more:hover{background:#ffffff3a;transform:scale(1.05)}
.poster{flex:0 0 auto;width:min(290px,34vw);aspect-ratio:2/3;border-radius:14px;position:relative;overflow:hidden;background:#000;box-shadow:0 30px 80px #000c,0 0 0 1px var(--line);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;animation:pop .9s .3s backwards,floaty 6s 1.3s ease-in-out infinite}
.poster:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.05)}
@keyframes floaty{50%{translate:0 -14px}}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff45 50%,transparent 60%);transform:translateX(-100%);animation:sweep 5s 1.5s infinite}
@keyframes sweep{60%,100%{transform:translateX(100%)}}
section{padding:50px 5vw 10px;max-width:1240px;margin:auto}
h2{font-size:1.4rem;margin-bottom:20px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:4px;height:1.3em;border-radius:2px;background:linear-gradient(var(--a),var(--b))}
.row{display:flex;gap:18px;overflow-x:auto;padding:8px 4px 24px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#f5b53d55 transparent}
.person{flex:0 0 150px;scroll-snap-align:start}
.ph{width:150px;height:205px;border-radius:14px;overflow:hidden;position:relative;display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:#1a1208;background:linear-gradient(160deg,hsl(var(--h) 85% 62%),hsl(calc(var(--h) + 30) 80% 42%));box-shadow:0 10px 30px #0009;transition:transform .3s,box-shadow .3s}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.person:hover .ph{transform:translateY(-8px) scale(1.04);box-shadow:0 20px 44px #f5b53d33}
.person b{display:block;margin-top:12px;font-size:.95rem}
.person span{color:var(--muted);font-size:.82rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding-bottom:50px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;transition:transform .25s,border-color .25s}
.card h3{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.card p{line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{background:#f5b53d1f;border:1px solid #f5b53d55;border-radius:99px;padding:4px 12px;font-size:.85rem}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s,border-color .25s}
.rv.show{opacity:1;transform:none}
.card.show:hover{transform:translateY(-6px);border-color:var(--a)}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#000e;backdrop-filter:blur(8px);padding:20px}
.modal.on{display:flex;animation:fade .3s both}
.box{position:relative;width:min(1000px,100%)}
.vid{position:relative;aspect-ratio:16/9;max-height:85vh;margin:auto;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 30px 100px #f5b53d44;animation:pop .4s both}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;color-scheme:normal;background:#000}
.x{position:absolute;top:-48px;right:0;background:#ffffff24;color:#fff;border-radius:50%;width:40px;height:40px;padding:0;font-size:1.1rem}
.x:hover{background:#ffffff44}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:760px){.hero{padding-top:84px;padding-bottom:50px}.hero::before{background:radial-gradient(520px circle at var(--mx,72%) var(--my,30%),#f5b53d30,transparent 60%),linear-gradient(#0c0a0866,#0c0a08d9)}.in{flex-direction:column;align-items:center;text-align:center;gap:26px}.poster{order:-1;width:min(62vw,250px)}.txt{display:flex;flex-direction:column;align-items:center}.meta,.btns{justify-content:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav id="nav"><div class="logo">EL HOBBIT</div></nav>

<header class="hero" id="hero">
  <div class="bd"></div>
  <div class="embers" id="embers"></div>
  <div class="in">
    <div class="txt">
      <div class="badge"><i></i><span>Película</span></div>
      <h1 id="title"></h1>
      <div class="meta"><b id="year"></b><span class="pill" id="rating"></span><b id="dur"></b></div>
      <div class="gen" id="genTop"></div>
      <p class="desc" id="desc"></p>
      <div class="btns">
        <button class="play" id="playBtn">▶ Reproducir</button>
        <button class="more" id="moreBtn">ⓘ Más información</button>
      </div>
    </div>
    <div class="poster" id="poster"><img id="posterImg" alt="Póster de la película"></div>
  </div>
</header>

<section id="cast">
  <h2>Reparto</h2>
  <div class="row" id="castRow"></div>
</section>

<section id="info">
  <h2>Detalles</h2>
  <div class="grid">
    <div class="card rv"><h3>Dirección</h3><p id="director"></p></div>
    <div class="card rv"><h3>Año</h3><p id="year2"></p></div>
    <div class="card rv"><h3>Duración</h3><p id="dur2"></p></div>
    <div class="card rv"><h3>Clasificación</h3><p id="rating2"></p></div>
    <div class="card rv"><h3>Géneros</h3><div class="tags" id="genres"></div></div>
  </div>
</section>

<div class="modal" id="modal"><div class="box"><button class="x" id="close" aria-label="Cerrar">✕</button><div class="vid" id="vid"></div></div></div>

};
const $=id=>document.getElementById(id);
document.title=DATA.title;
$("title").textContent=DATA.title;
$("year").textContent=$("year2").textContent=DATA.year;
$("rating").textContent=$("rating2").textContent=DATA.rating;
$("dur").textContent=$("dur2").textContent=DATA.duration;
$("desc").textContent=DATA.desc;$("director").textContent=DATA.director;
$("genTop").textContent=DATA.genres.join(" · ");
DATA.genres.forEach(g=>{const s=document.createElement("span");s.textContent=g;$("genres").appendChild(s)});
$("posterImg").src=DATA.posterImage;
document.documentElement.style.setProperty("--poster","url("+DATA.posterImage+")");
DATA.cast.forEach((p,i)=>{
  const d=document.createElement("div");d.className="person rv";
  const ph=document.createElement("div");ph.className="ph";ph.style.setProperty("--h",30+i*42);
  ph.textContent=p.name.split(" ").map(w=>w[0]).slice(0,2).join("");
  if(p.photo){const im=document.createElement("img");im.src=p.photo;im.alt=p.name;im.onerror=()=>im.remove();ph.appendChild(im)}
  const n=document.createElement("b");n.textContent=p.name;
  const r=document.createElement("span");r.textContent=p.role;
  d.append(ph,n,r);$("castRow").appendChild(d);
});
function openP(){
  const f=document.createElement("iframe");
  f.src=DATA.video+"&quality=1080p&autoplay=1";
  f.allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share";
  f.referrerPolicy="strict-origin-when-cross-origin";f.title=DATA.title;f.allowFullscreen=true;
  f.onload=()=>{try{if(window.Vimeo)new Vimeo.Player(f).setQuality("1080p").catch(()=>{})}catch(e){}};
  $("vid").replaceChildren(f);$("modal").classList.add("on");document.body.style.overflow="hidden";
}
function closeP(){$("modal").classList.remove("on");$("vid").replaceChildren();document.body.style.overflow=""}
$("playBtn").onclick=openP;$("close").onclick=closeP;
$("moreBtn").onclick=()=>$("cast").scrollIntoView({behavior:"smooth"});
addEventListener("scroll",()=>$("nav").classList.toggle("solid",scrollY>40));
const hero=$("hero"),poster=$("poster");
hero.addEventListener("mousemove",e=>{const r=hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;hero.style.setProperty("--mx",e.clientX-r.left+"px");hero.style.setProperty("--my",e.clientY-r.top+"px");poster.style.setProperty("--ry",(x-.72)*16+"deg");poster.style.setProperty("--rx",(.4-y)*14+"deg")});
const em=$("embers");
for(let i=0;i<28;i++){const s=document.createElement("i");s.style.cssText=`left:${Math.random()*100}%;--s:${2+Math.random()*4}px;--d:${8+Math.random()*10}s;--x:${(Math.random()-.5)*160}px;--c:${Math.random()>.5?"#ffc857":"#ff8a3d"};animation-delay:-${Math.random()*14}s`;em.appendChild(s)}
const rv=document.querySelectorAll(".rv");
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("show");setTimeout(()=>e.target.style.transitionDelay="0ms",1000);io.unobserve(e.target)}}),{threshold:.15});
  rv.forEach((c,i)=>{c.style.transitionDelay=(i%8)*90+"ms";io.observe(c)});
}else rv.forEach(c=>c.classList.add("show"));
</script>
